<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DansLabTrader · KuCoin grid radar</title>
<style>
:root{--ink:#182b2a;--muted:#60706d;--paper:#f3f5f1;--card:#fff;--line:#d9e1da;--accent:#1d7567}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{max-width:1500px;margin:auto;padding:32px}header{display:flex;justify-content:space-between;gap:20px;align-items:end;margin-bottom:24px}h1{font-size:34px;letter-spacing:-1px;margin:4px 0}h2{font-size:18px;margin:0 0 12px}.eyebrow{color:var(--accent);font-size:12px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase}.muted{color:var(--muted)}a{color:var(--accent)}section{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;margin:16px 0}.table{overflow:auto}table{border-collapse:collapse;width:100%;font-size:13px}th,td{border-bottom:1px solid var(--line);padding:10px 12px;text-align:right;white-space:nowrap}th:first-child,td:first-child,th:nth-child(2),td:nth-child(2){text-align:left}th{color:var(--muted);font-size:11px;text-transform:uppercase}tr:last-child td{border:0}.badge{border:1px solid var(--line);border-radius:5px;padding:2px 7px}.empty{color:var(--muted);text-align:left}footer{color:var(--muted);margin-top:22px}@media(max-width:600px){main{padding:18px}header{display:block}h1{font-size:28px}}
</style>
</head>
<body><main><header><div><div class="eyebrow">Read-only operator recommender</div><h1>KuCoin grid radar</h1><div class="muted" id="stamp">Loading the latest hourly scan.</div></div><a href="/">Paper dashboard</a></header><div id="sections"></div><footer>No orders are placed. Dan enters every setup manually in KuCoin.</footer></main>
<script>
'use strict';
const labels={majors:'Majors read',turning_up:'Turning up',turning_down:'Turning down',long:'Long',short:'Short',neutral:'Neutral',movers:'Movers'};
const el=(tag,text,cls)=>{const node=document.createElement(tag);if(text!==undefined)node.textContent=text;if(cls)node.className=cls;return node};
const number=(value,digits=2)=>Number.isFinite(value)?value.toLocaleString('en-US',{maximumFractionDigits:digits}):'—';
function render(report){const root=document.getElementById('sections');root.replaceChildren();document.getElementById('stamp').textContent='Scan '+new Date(report.asof_ms).toLocaleString('en-GB',{timeZone:'Europe/Bucharest'})+' · Europe/Bucharest';for(const[key,title]of Object.entries(labels)){const section=el('section'),heading=el('h2',title),wrap=el('div',undefined,'table'),table=el('table'),head=el('thead'),body=el('tbody'),tr=el('tr');for(const name of ['Symbol','Direction','Price','Turnover $M','ATR 1h %','Range','Step %','Grids','Expected grids/h'])tr.append(el('th',name));head.append(tr);const rows=Array.isArray(report.sections?.[key])?report.sections[key]:[];for(const row of rows){const line=el('tr');const values=key==='majors'?[row.symbol,row.direction,'—','—','—','—','—','—','—']:[row.symbol,row.direction,number(row.price,6),number(row.turnover_24h_usdt/1e6,1),number(row.atr_1h_pct),number(row.range_low,6)+' – '+number(row.range_high,6),number(row.step_pct),number(row.grids,0),number(row.expected_grids_per_hour)];values.forEach((value,index)=>line.append(el('td',value,index===1?'badge':'')));body.append(line)}if(!rows.length){const line=el('tr'),cell=el('td','No qualifying coins.','empty');cell.colSpan=9;line.append(cell);body.append(line)}table.append(head,body);wrap.append(table);section.append(heading,wrap);root.append(section)}}
async function load(){let response=await fetch('/api/radar',{cache:'no-store'});if(!response.ok)response=await fetch('/data/radar.json',{cache:'no-store'});if(!response.ok)throw new Error();render(await response.json())}load().catch(()=>{document.getElementById('stamp').textContent='Radar data is unavailable.'});
</script></body></html>
